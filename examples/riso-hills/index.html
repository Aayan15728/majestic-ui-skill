<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ebb424">
<title>Scorecraft — music written to fit your video</title>
<style>
@font-face { font-family: "Geist"; src: url(../fonts/geist-sans-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Geist"; src: url(../fonts/geist-sans-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Geist"; src: url(../fonts/geist-sans-latin-700-normal.woff2) format("woff2"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Geist"; src: url(../fonts/geist-sans-latin-800-normal.woff2) format("woff2"); font-weight: 800; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url(../fonts/geist-mono-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; }

:root {
  --paper: #ebb424;
  --cream: #fbf1d9;
  --ink: #1a1712;
  --ink-2: #3a2f12;
  --cloud-ink: #4a86b8;
  --hill-1: #9fcb48;
  --hill-2: #6db33f;
  --hill-3: #3e8a3a;
  --hill-4: #2c6b35;
  --font-ui: "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --gutter: 20px;
}
@media (min-width: 810px) { :root { --gutter: 48px; } }
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; color: var(--ink); font: 400 17px/1.6 var(--font-ui); -webkit-font-smoothing: antialiased; }
h1, p { margin: 0; }
h1 { text-wrap: balance; }
p { text-wrap: pretty; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--cream); }
main { overflow-x: clip; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }

/* ---------- atmosphere: a risograph print — grain on mustard paper, halftone clouds, hatched hills ---------- */
.hero { position: relative; isolation: isolate; min-height: max(760px, 100svh); overflow: hidden; }
.print { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; }
.drift { animation: drift 60s linear infinite alternate; } /* slop-ok: slow ambient drift, has a visible Pause control and stops under reduced motion */
.drift.b { animation-duration: 80s; animation-direction: alternate-reverse; } /* slop-ok: same drift, second layer */
@keyframes drift { to { transform: translateX(36px); } }
.paused .drift { animation-play-state: paused; }

/* ---------- nav ---------- */
.nav { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 24px var(--gutter); }
.logo svg { width: 64px; height: 44px; display: block; }
.links { position: absolute; left: 50%; translate: -50% 0; display: flex; gap: 36px; font-size: 15px; font-weight: 500; }
.links a { padding-block: 4px; border-bottom: 1px solid transparent; transition: border-color 150ms var(--ease); }
.links a:hover { border-color: var(--ink); }
.more { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--ink); transition: background-color 150ms var(--ease); }
.more:hover { background: rgb(26 23 18 / .08); }
.more svg { width: 18px; height: 18px; }

/* ---------- copy ---------- */
.copy { position: relative; max-width: 920px; margin-inline: auto; padding: 96px var(--gutter) 0; text-align: center; display: flex; flex-direction: column; align-items: center; }
h1 { font: 700 clamp(2.25rem, 3.6vw, 3rem)/1.05 var(--font-ui); letter-spacing: -0.03em; }
h1 span { display: block; margin-top: 4px; font-weight: 800; font-size: 1.6em; text-transform: uppercase; letter-spacing: -0.045em; line-height: .95; }
.lead { margin-top: 20px; max-width: 40ch; font-size: 18px; font-weight: 500; color: var(--ink-2); }
.ctas { margin-top: 32px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 60px; padding-inline: 32px; border-radius: 999px; font: 700 20px/1 var(--font-ui); letter-spacing: -0.01em;
  transition: background-color 150ms var(--ease), transform 150ms var(--ease); }
.btn:active { transform: scale(.97); }
.btn.cream { background: var(--cream); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.cream:hover { background: #fff8e8; }
.btn.ink { background: var(--ink); color: var(--cream); }
.btn.ink:hover { background: #2c2720; }

/* ---------- foot of the hero ---------- */
.follow { position: absolute; left: 50%; bottom: 28px; translate: -50% 0; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--cream); font: 500 12px/1 var(--font-mono); text-transform: uppercase; }
.follow svg { width: 16px; height: 28px; }
.pause { position: absolute; right: var(--gutter); bottom: 24px; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-inline: 14px; border: 0; border-radius: 999px; background: rgb(26 23 18 / .64); color: var(--cream); font: 500 13px/1 var(--font-ui); cursor: pointer; backdrop-filter: blur(6px); }
.pause:hover { background: rgb(26 23 18 / .78); }
.pause svg { width: 12px; height: 12px; }

@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.copy > * { animation: rise 680ms var(--ease) both; }
.copy > :nth-child(2) { animation-delay: 70ms; } .copy > :nth-child(3) { animation-delay: 140ms; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .pause { display: none; } }

@media (max-width: 899px) {
  .links { display: none; }
  .copy { padding-top: 56px; }
  .ctas { width: 100%; flex-direction: column; }
  .btn { height: 56px; font-size: 18px; }
  .hero { min-height: max(820px, 100svh); }
}
.skip { position: absolute; left: 12px; top: -48px; z-index: 100; padding: 8px 14px; border-radius: 8px; background: var(--ink); color: var(--cream); font: 500 14px/1 var(--font-ui); transition: top 150ms var(--ease); }
.skip:focus-visible { top: 12px; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main">
  <section class="hero" id="hero" aria-labelledby="h">
    <svg class="print" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 0  0 0 0 .55 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
        <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="3" seed="2"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
        <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><rect width="7" height="7" fill="#fbf1d9"/><circle cx="3.5" cy="3.5" r="1.5" fill="#4a86b8"/></pattern>
        <pattern id="halftone-lite" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><rect width="7" height="7" fill="#fbf1d9"/><circle cx="3.5" cy="3.5" r=".8" fill="#4a86b8"/></pattern>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><rect width="6" height="6" fill="#3e8a3a"/><path d="M0 0v6" stroke="#2c6b35" stroke-width="2"/></pattern>
        <pattern id="hatch-lite" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><rect width="6" height="6" fill="#9fcb48"/><path d="M0 0v6" stroke="#6db33f" stroke-width="1.5"/></pattern>
        <g id="cloud">
          <g filter="url(#rough)">
            <circle cx="0" cy="0" r="70" fill="url(#halftone)"/><circle cx="80" cy="-30" r="90" fill="url(#halftone-lite)"/><circle cx="170" cy="-6" r="74" fill="url(#halftone)"/>
            <circle cx="250" cy="20" r="56" fill="url(#halftone-lite)"/><circle cx="40" cy="40" r="60" fill="url(#halftone-lite)"/><circle cx="140" cy="50" r="70" fill="url(#halftone)"/><circle cx="-60" cy="40" r="48" fill="url(#halftone-lite)"/>
            <circle cx="-20" cy="96" r="70" fill="url(#halftone)"/><circle cx="100" cy="110" r="80" fill="url(#halftone-lite)"/><circle cx="220" cy="100" r="70" fill="url(#halftone)"/><circle cx="300" cy="80" r="44" fill="url(#halftone-lite)"/>
          </g>
        </g>
      </defs>
      <rect width="1440" height="900" fill="#ebb424"/>
      <rect width="1440" height="900" fill="#ebb424" filter="url(#grain)"/>
      <g class="drift"><use href="#cloud" transform="translate(140 600) scale(1.15)"/><use href="#cloud" transform="translate(1030 590) scale(1.3)"/></g>
      <g class="drift b"><use href="#cloud" transform="translate(580 610) scale(1.05)"/><use href="#cloud" transform="translate(-170 690) scale(.9)"/><use href="#cloud" transform="translate(1310 700) scale(.85)"/></g>
      <g filter="url(#rough)">
        <path d="M-40 700C140 610 300 640 420 680S700 640 840 610 1180 650 1480 600V900H-40Z" fill="url(#hatch-lite)"/>
        <path d="M-40 760C200 690 360 720 520 750S820 690 1000 700 1300 740 1480 700V900H-40Z" fill="#6db33f"/>
        <path d="M-40 800C160 760 300 770 460 800S760 770 900 790 1240 760 1480 780V900H-40Z" fill="url(#hatch)"/>
        <path d="M-40 850C240 820 500 830 720 860S1200 830 1480 850V900H-40Z" fill="#9fcb48"/>
      </g>
      <g transform="translate(560 796) scale(.8)" fill="#1a1712">
        <circle cx="10" cy="-58" r="7"/><path d="M4-50h12l4 24-6 2-4-14-2 30h-4l-2-30-4 14-6-2z"/><path d="M6-12 0 6h5l5-14 5 14h5l-6-18z"/><path d="M16-40 34-22l-3 3-17-15z"/><ellipse cx="32" cy="-18" rx="7" ry="5" transform="rotate(40 32 -18)"/>
      </g>
    </svg>

    <nav class="nav" aria-label="Main">
      <a class="logo" href="#" aria-label="Scorecraft home"><svg viewBox="0 0 64 44" fill="none" stroke="#1a1712" stroke-width="2.4" stroke-linecap="round"><path d="M4 30c4-14 8-14 10 0s6 14 10-2 6-26 10-10 6 22 10 4 6-12 8-2 4 8 8 2"/></svg></a>
      <div class="links"><a href="#">MCP docs</a><a href="#">API docs</a><a href="#">Research</a></div>
      <a class="more" href="#" aria-label="Menu"><svg viewBox="0 0 18 18" fill="#1a1712"><circle cx="9" cy="3" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="9" cy="15" r="1.6"/></svg></a>
    </nav>

    <div class="copy">
      <h1 id="h">Create music <span>fit to your video</span></h1>
      <p class="lead">Upload a cut. Scorecraft writes an original soundtrack that lands on every scene change, in about 40 seconds.</p>
      <div class="ctas"><a class="btn cream" href="#">Get started</a><a class="btn ink" href="#">Use the MCP</a></div>
    </div>

    <a class="follow" href="#"><span>Follow the sound</span><svg viewBox="0 0 16 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 2v24M2 20l6 6 6-6"/></svg></a>
    <button class="pause" type="button" aria-pressed="false" id="pause"><svg viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="1" width="3" height="10"/><rect x="7" y="1" width="3" height="10"/></svg><span>Pause</span></button>
  </section>
</main>
<script>
const b = document.getElementById("pause"), hero = document.getElementById("hero");
b.addEventListener("click", () => {
  const p = hero.classList.toggle("paused");
  b.setAttribute("aria-pressed", String(p));
  b.querySelector("span").textContent = p ? "Play" : "Pause";
});
</script>
</body>
</html>
